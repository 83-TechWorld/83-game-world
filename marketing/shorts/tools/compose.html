// ---------------- captions ----------------
const caps=$('caps')

 // mark every word inside *...* as emphasised

function drawCaps(t){capEls.forEach((c,ci)=>{const vis=t>=c.a-.05&&t<=c.b+.35;c.d.style.display=vis?'':'none';if(!vis)return;
  const hook=ci===0, top=hook?470:420;c.d.style.top=(top-c.d.offsetHeight/2)+'px';
  // bang-motion rule: alternate entry direction and size between consecutive captions
  const dir=ci%2?1:-1;
  if(G==='habit-hero'){const night=t>10.4&&t<16.4;c.d.style.color=night?'#fff':'#27315a';c.d.style.textShadow=night?C.shadow:'0 4px 0 rgba(255,255,255,.7)';c.words.forEach(w=>{if(w.classList.contains('em'))w.style.color=night?'#ffe066':'#e8590c'})}
  c.words.forEach((w,i)=>{const k=prog(t,c.a+i*.075,c.a+i*.075+.42,'back'),o=prog(t,c.b,c.b+.3,'inOut');
   let tr;if(G==='memory-matrix')tr=`perspective(600px) rotateX(${(1-k)*-90}deg) translateY(${o*-40}px)`;
   else if(G==='safety-scout')tr=`translateX(${(1-k)*dir*260}px) skewX(${(1-k)*-12}deg) translateY(${o*-40}px)`;
   else if(G==='habit-hero')tr=`translateY(${(1-k)*90+o*-40}px) scale(${.6+.4*k})`;
   else tr=`translateY(${(1-k)*30}px) rotate(${(1-k)*-6}deg)`;
   w.style.transform=tr;w.style.opacity=clamp(k*1.4)*(1-o);w.style.filter=`blur(${(1-clamp(k*1.3))*14+o*10}px)`})})}

const footT=t=>{const c=clipAt(Math.min(t,C.endAt-.001));return c.from+(Math.min(t,C.endAt)-c.at)*(c.rate||1)}
function drawPhone(t){
 const enter=prog(t,0,1.05,'back'),leave=prog(t,C.endAt,C.endAt+.7,'inOut');
 let s=(LAND?1:1.14)*kf(t,C.zoom||[[0,1]]),x=LAND?40:260,y=lerp(2100,LAND?760:650,enter)+leave*1500,r=(1-enter)*-9+leave*12,ry=0;
 // cut transitions

   if(C.transition==='flip'){ry=k<0?E.inOut(1+k)*90:(1-E.out(k))*-90}
   else if(C.transition==='bump'||C.transition==='hazard'||C.transition==='chalk'){s*=1-.05*Math.sin(clamp(k+1,0,2)*Math.PI/2*2)*(k<0?0:1);flash.style.opacity=k>0?(1-k)*.55:0}}}
 if(!C.clips.slice(1).some(c=>Math.abs(t-c.at)<.36))flash.style.opacity=0
 const yOff=0;window.__ph={x,y:y+yOff,s,r}
