<style>
.picrow{display:flex;align-items:center;justify-content:center;gap:14px}

<script>
// easy, useful words for every letter A–Z (each has a clear picture). X words contain x (box, six) and the gap is always on the x.
const W={a:[['ant','🐜'],['apple','🍎'],['arm','💪']],b:[['bus','🚌'],['bat','🦇'],['bed','🛏️'],['ball','⚽'],['bee','🐝']],
 c:[['cat','🐱'],['car','🚗'],['cake','🎂'],['cow','🐄']],d:[['dog','🐶'],['duck','🦆'],['drum','🥁'],['door','🚪']],
 e:[['egg','🥚'],['eye','👁️'],['ear','👂'],['eagle','🦅']],f:[['fish','🐟'],['fox','🦊'],['frog','🐸'],['fire','🔥']],
 g:[['goat','🐐'],['gift','🎁'],['girl','👧'],['grapes','🍇']],h:[['hat','🎩'],['hen','🐔'],['hand','✋'],['house','🏠']],
 i:[['ice','🧊'],['ink','🖋️'],['insect','🐛']],j:[['jet','🛩️'],['jeep','🚙'],['juice','🧃'],['joker','🃏']],
 k:[['key','🔑'],['kite','🪁'],['king','🤴'],['kiwi','🥝']],l:[['lion','🦁'],['leaf','🍃'],['lock','🔒'],['lemon','🍋']],
 m:[['map','🗺️'],['moon','🌙'],['milk','🥛'],['mango','🥭']],n:[['net','🥅'],['nut','🥜'],['nose','👃'],['nine','9️⃣']],
 o:[['owl','🦉'],['ox','🐂'],['onion','🧅'],['orange','🍊']],p:[['pen','🖊️'],['pig','🐷'],['pear','🍐'],['pizza','🍕']],
 q:[['queen','👸']],r:[['rat','🐀'],['ring','💍'],['rose','🌹'],['rain','🌧️'],['rabbit','🐇']],
 s:[['sun','☀️'],['star','⭐'],['sock','🧦'],['ship','🚢']],t:[['ten','🔟'],['tent','⛺'],['tree','🌳'],['tiger','🐯'],['train','🚆']],
 u:[['up','⬆️'],['unicorn','🦄'],['umbrella','☂️']],v:[['van','🚐'],['vase','🏺'],['violin','🎻']],
 w:[['web','🕸️'],['wolf','🐺'],['watch','⌚'],['whale','🐳']],x:[['box','📦'],['six','6️⃣']],
 y:[['yarn','🧶'],['yawn','🥱'],['yellow','🟡']],z:[['zip','🤐'],['zero','0️⃣'],['zebra','🦓']]};
const AZ='abcdefghijklmnopqrstuvwxyz',VOW='aeiou';
const ALL=[];for(const l in W)W[l].forEach(([w,e])=>ALL.push({w,e,l}));
// letter names, read the way an Indian-English teacher says them (zed, not zee)
const NAME={a:'ay',b:'bee',c:'see',d:'dee',e:'ee',f:'ef',g:'jee',h:'aitch',i:'eye',j:'jay',k:'kay',l:'el',m:'em',n:'en',o:'oh',p:'pee',q:'queue',r:'ar',s:'ess',t:'tee',u:'you',v:'vee',w:'double you',x:'ex',y:'why',z:'zed'};
const worlds={w1:{label:'ABC Garden',bg:['#e9ffd6','#7fd36b'],deco:['🍎','🐝','🌼','🐶']},w2:{label:'Letter Lake',bg:['#d8f3ff','#4fb0e8'],deco:['🐟','🦆','🌙','🔑']},
 w3:{label:'Word Woods',bg:['#fff1cf','#e7a34a'],deco:['🦊','🌳','🦉','🍄']},w4:{label:'Double Gaps',bg:['#ffe0ec','#ec6fa4'],deco:['🎁','🍭','🎈','⭐']},w5:{label:'Spelling Star',bg:['#ecdcff','#8a5ad8'],deco:['🏆','⭐','✨','🦄']}};
const levels=[
 {name:'A to E',world:'w1',mode:'gap',letters:'abcde',gaps:1},
 {name:'F to J',world:'w1',mode:'gap',letters:'fghij',gaps:1},
 {name:'K to O',world:'w2',mode:'gap',letters:'klmno',gaps:1},
 {name:'P to T',world:'w2',mode:'gap',letters:'pqrst',gaps:1},
 {name:'U to Z',world:'w3',mode:'gap',letters:'uvwxyz',gaps:1},
 {name:'Vowel Hunt',world:'w3',mode:'vowel',n:6},
 {name:'2 Gaps: A–M',world:'w4',mode:'gap',letters:'abcdefghijklm',gaps:2,n:6},
 {name:'2 Gaps: N–Z',world:'w4',mode:'gap',letters:'nopqrstuvwxyz',gaps:2,n:6},
 {name:'Listen & Spell',world:'w5',mode:'listen',n:5},
 {name:'Spelling Boss',world:'w5',mode:'gap',letters:AZ,gaps:2,n:8,time:240}];
// choose the words and which letters are hidden
function plan(L){
 if(L.mode==='vowel')return K.sample(ALL.filter(x=>x.w.length>=3&&x.w.length<=6),L.n).map(x=>{const vi=[...x.w].map((c,i)=>VOW.includes(c)?i:-1).filter(i=>i>=0);return{...x,gaps:K.sample(vi,Math.min(2,vi.length)).sort((a,b)=>a-b)};});
 if(L.mode==='listen')return K.sample(ALL.filter(x=>x.w.length>=3&&x.w.length<=5),L.n).map(x=>({...x,gaps:[...x.w].map((c,i)=>i).slice(1)}));
 let letters=[...L.letters];if(L.n)letters=K.sample(letters,L.n);
 return letters.map(l=>{const pool=W[l].filter(x=>L.gaps<2||x[0].length>=4);const [w,e]=K.pick(pool.length?pool:W[l]);
  let gaps;if(l==='x'){const xi=w.indexOf('x');gaps=L.gaps<2?[xi]:[xi,K.pick([...w].map((c,i)=>i).filter(i=>i!==xi))];}
  else gaps=K.sample([...w].map((c,i)=>i),Math.min(L.gaps,w.length-1));
  return{w,e,l,gaps:gaps.sort((a,b)=>a-b)};});}
function build(L,api,stage){
 const items=plan(L);let wi=0;
 const head=K.h('div','say-line'),picrow=K.h('div','picrow'),row=K.h('div','wrow'),ch=K.h('div','choices'),tools=K.h('div','btns');
 stage.append(picrow,head,row,ch,tools);
 const hear=K.h('button','btn small','🔊 Hear the word');tools.appendChild(hear);
 if(L.time)api.timer(L.time,'Time is up! Try again.');
 const gone=()=>!stage.isConnected||document.querySelector('.modal');
 function word(){if(gone())return;const it=items[wi],w=it.w;let gi=0,busy=false;
  picrow.innerHTML='';picrow.appendChild(K.h('div','pic',it.e));if(L.mode==='gap'&&L.gaps===1)picrow.appendChild(K.h('div','badge',it.l.toUpperCase()+it.l));
  row.innerHTML='';const cells=[...w].map((c,i)=>{const e=K.h('div','lt'+(it.gaps.includes(i)?' gap':''),c);row.appendChild(e);return e;});
  const intro=()=>K.sayLine(head,L.mode==='listen'?`${w}. Spell the word!`:`${w}. Find the missing letter${it.gaps.length>1?'s':''}!`,{hide:w});
  hear.disabled=false;hear.onclick=()=>{K.audio();if(!busy)intro();};
  // letter buttons for the gap that is glowing now
  const choices=()=>{ch.innerHTML='';cells.forEach((c,i)=>c.classList.toggle('cur',i===it.gaps[gi]));const need=w[it.gaps[gi]];let opts;
   if(L.mode==='vowel')opts=[...VOW];
   else if(L.mode==='listen')opts=null;
   else opts=K.shuffle([need,...K.sample([...AZ].filter(c=>c!==need),3)]);
   if(opts)opts.forEach(c=>mk(c));};
  const mk=c=>{const b=K.h('button','choice let',c);b.onclick=()=>tap(b,c);ch.appendChild(b);return b;};
  // listen & spell: the word's own letters, shuffled; each button is used once
  if(L.mode==='listen'){ch.innerHTML='';K.shuffle(it.gaps.map(i=>w[i])).forEach(c=>mk(c));cells.forEach((c,i)=>c.classList.toggle('cur',i===it.gaps[0]));}
  else choices();
  function tap(b,c){K.audio();if(busy)return;const i=it.gaps[gi];
   if(c!==w[i]){b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');api.bad(`Not ${NAME[c]}. Listen: ${w}.`);return;}
   K.sfx.ok();cells[i].classList.remove('gap','cur');cells[i].classList.add('fill');gi++;
   if(L.mode==='listen'){b.classList.add('used');b.disabled=true;}
   if(gi<it.gaps.length){K.saySeq([{t:NAME[c],el:cells[i],rate:1}]);if(L.mode==='listen')cells.forEach((x,k)=>x.classList.toggle('cur',k===it.gaps[gi]));else choices();return;}
   // word done: spell it letter by letter (each letter lights up while it is said), then say the whole word
   busy=true;hear.disabled=true;ch.querySelectorAll('button').forEach(x=>x.disabled=true);head.textContent=it.e+' '+w;api.coach(`${it.e} ${w}!`,false);
   K.saySeq([...cells.map((el,k)=>({t:NAME[w[k]],el,rate:1,gap:60})),{t:w,el:row,gap:250}],()=>{if(gone())return;wi++;api.progress(wi,items.length);
     if(wi===items.length){K.confetti(60);api.win();}else{K.sfx.whoosh();setTimeout(word,250);}});}
  intro();}
 api.coach(L.mode==='listen'?'Listen and spell the whole word!':L.mode==='vowel'?'Find the missing vowels: a, e, i, o, u!':'Look, listen, and fill the gap!',false);
 setTimeout(word,200);
}
K.start({id:'spell-gaps',title:'Spell Gaps',emoji:'✏️',worlds,levels,build});
</script></body></html>
