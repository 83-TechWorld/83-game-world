 function setAngle(n,a){const g=snap[n];if(n==='hour')ang.hour=Math.round(a/g)*g%360;else ang[n]=(Math.round(a/g)*g)%360;draw();}
 svgEl.addEventListener('pointerdown',e=>{e.preventDefault();K.audio();const p=pointer(e);
  let best=null,bd=40;hands.forEach(n=>{const len={hour:44,minute:72,second:80}[n],a=ang[n]*Math.PI/180,tx=Math.sin(a)*len,ty=-Math.cos(a)*len,pr=p.r,pa=p.a*Math.PI/180,px=Math.sin(pa)*pr,py=-Math.cos(pa)*pr,d=Math.hypot(px-tx,py-ty);if(d<bd){bd=d;best=n;}});
  if(best){active=best;mark();}drag=true;try{svgEl.setPointerCapture(e.pointerId);}catch(_){}setAngle(active,p.a);K.sfx.tick();});
 svgEl.addEventListener('pointermove',e=>{if(!drag)return;const p=pointer(e),old=active==='minute'?mv():0;setAngle(active,p.a);if(active==='minute'&&mv()!==old)K.sfx.tick();});
 const stop=()=>{drag=false;};svgEl.addEventListener('pointerup',stop);svgEl.addEventListener('pointercancel',stop);
 draw();api.say(`Set the clock to ${sayT(t,L.sec)}`);
 let ok=false;
 go.onclick=()=>{if(ok)return;K.audio();const tolH=L.tolH||14;const mOk=mv()===t.m,hOk=angDiff(ang.hour,hourAng(t.h,t.m))<=tolH,sOk=!hands.includes('second')||sv()===t.s;
  if(mOk&&hOk&&sOk){ok=true;K.sfx.ok();api.coach(K.pick(K.PRAISE)+' '+fmtT(t,L.sec)+' is '+words(t)+'.');el.classList.add('hl');setTimeout(c.done,1300);}
  else{const msg=!hOk?(t.m===0?`The short hour hand should point right at ${t.h}.`:t.m===30?`At half past, the hour hand sits halfway between ${t.h} and ${t.h%12+1}.`:`Check the short hour hand near ${t.h}.`):!mOk?`Check the long minute hand. It should point to ${t.m===0?'12':t.m/5%1===0?t.m/5:'the '+t.m+' minute mark'}.`:`Check the thin second hand: ${t.s} seconds.`;api.bad(msg);}};
 c.solve=()=>{ang.hour=hourAng(t.h,t.m)%360;ang.minute=t.m*6;ang.second=t.s*6;draw();go.click();};
};
R.mix=(c)=>{const m=K.pick(c.L.mix);const sub=Object.assign({},c.L,m.p||{});c.L=sub;R[m.m](c);};
// ---------- levels ----------
const worlds={hour:{label:'Hour Town',bg:['#d6f5ff','#5bb4e8'],deco:['🕐','☁️','🏡','🌞']},minute:{label:'Minute Meadow',bg:['#e1ffd6','#5cc46a'],deco:['🕒','🌼','🦋','🌳']},exact:{label:'Exact Time Land',bg:['#ffeccc','#f59e42'],deco:['🕓','⭐','🎯','🧭']},second:{label:'Second Springs',bg:['#ffd9e4','#e0507a'],deco:['⏱️','⚡','🕔','💨']},day:{label:'Daily Routine',bg:['#e6ddff','#6a4fc2'],deco:['🌅','🌙','⭐','😴']},master:{label:'Clock Master',bg:['#c9d5ff','#1c2457'],deco:['🏆','⏰','🕰️','👑']}};
const HOURS=[0],HALF=[0,30],QTR=[0,15,30,45],FIVE=[0,5,10,15,20,25,30,35,40,45,50,55];
const levels=[
 {name:'Clock Hands',world:'hour',mode:'tap',q:6,hands:['hour','minute']},
 {name:'O\'Clock',world:'hour',mode:'read',q:6,mins:HOURS},
 {name:'Set O\'Clock',world:'hour',mode:'set',q:4,mins:HOURS,hands:['hour','minute'],digital:true,tolH:14},
 {name:'Half Past',world:'hour',mode:'read',q:6,mins:HALF},
 {name:'Set Half Past',world:'hour',mode:'set',q:4,mins:HALF,digital:true,step:30,tolH:11},
 {name:'Quarter Time',world:'minute',mode:'read',q:6,mins:QTR,minNums:true},
 {name:'Set Quarters',world:'minute',mode:'set',q:4,mins:QTR,digital:true,step:5,minNums:true,tolH:11},
 {name:'5-Minute Jumps',world:'minute',mode:'read',q:6,mins:FIVE,minNums:true},
 {name:'Set 5 Minutes',world:'minute',mode:'set',q:5,mins:FIVE,digital:true,step:5,minNums:true,tolH:10},
 {name:'Match Clock',world:'minute',mode:'match',q:5,mins:FIVE},
 {name:'Any Minute',world:'exact',mode:'read',q:6,step:1,minNums:true},
 {name:'Set Any Minute',world:'exact',mode:'set',q:5,step:1,digital:true,minNums:true,tolH:10},
 {name:'Hide the Hint',world:'exact',mode:'set',q:5,step:1,digital:false,tolH:9},
 {name:'Minutes Later',world:'exact',mode:'later',q:6,mins:QTR,add:[15,30,45,60]},
 {name:'How Many Hours',world:'exact',mode:'dur',q:6,story:'How many hours go by?',a:'Starts',b:'Ends'},
 {name:'Second Hand',world:'second',mode:'tap',q:6,hands:['hour','minute','second']},
 {name:'Read Seconds',world:'second',mode:'read',q:6,mins:FIVE,sec:true,minNums:true},
 {name:'Set Seconds',world:'second',mode:'set',q:4,mins:FIVE,sec:true,hands:['hour','minute','second'],step:5,digital:true,minNums:true,tolH:10},
 {name:'AM or PM',world:'day',mode:'ampm',q:6},
 {name:'My Day',world:'day',mode:'set',q:5,scenes:true,step:5,digital:true,minNums:true,tolH:10},
 {name:'Clock Master!',world:'master',mode:'mix',q:10,time:300,step:1,mix:[{m:'read',p:{step:5,mins:FIVE,minNums:true}},{m:'match',p:{mins:FIVE}},{m:'later',p:{mins:FIVE,add:[10,20,30,45]}},{m:'set',p:{mins:FIVE,step:5,digital:false,minNums:true,tolH:10}}]}];
function build(L,api,stage){
 const box=K.h('div','');box.style.cssText='display:flex;flex-direction:column;align-items:center;gap:6px;width:100%';stage.appendChild(box);
 let qi=0,won=false,c;
 function next(){if(qi>=L.q){won=true;setTimeout(()=>api.win(),400);return;}box.innerHTML='';c={L:L,api,box,done:()=>{qi++;api.progress(qi,L.q);next();}};R[L.mode](c);}
 api.solve=()=>{const t=setInterval(()=>{if(won||document.querySelector('.modal')){clearInterval(t);return;}if(c&&c.solve)c.solve();},120);};
 next();if(L.time)api.timer(L.time,'Time is up! Try again, you can do it.');
 api.coach({tap:'Look closely at the clock hands!',read:'Look at the short hand first, then the long hand.',set:'Drag the hands to make the time. Then press Check!',match:'Find the clock that matches.',later:'Count the minutes forward!',dur:'Count the hours between the two clocks.',ampm:'AM is morning, PM is evening and night.',mix:'Show me everything you have learned!'}[L.mode]);
}
K.start({id:'tick-tock-clock',title:'Tick Tock Clock',emoji:'⏰',worlds,levels,build});
